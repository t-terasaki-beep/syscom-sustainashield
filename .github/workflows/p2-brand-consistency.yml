name: P2 brand consistency (offline)
on:
  pull_request:
    paths:
      - 'chiba-ene-lab/index.html'
      - 'chiba-land-search/index.html'
      - 'company.html'
      - 'contact.html'
      - 'faq.html'
      - 'flow.html'
      - 'grid-battery/index.html'
      - 'tools/publish/lp-media-set-v1/column/heat-and-solar/index.html'
      - 'tools/publish/lp-media-set-v1/column/ohisama-compare/index.html'
      - 'lp/gaichu-block/index.html'
      - 'lp/index.html'
      - 'privacy.html'
      - 'service.html'
      - 'shanetsu-chiba/index.html'
      - 'simulator/index.html'
      - 'sotsu-fit/index.html'
      - 'terasaki_lp.html'
      - 'voice.html'
      - 'tools/publish/lp-media-set-v1/column/build_column.py'
      - 'tools/publish/lp-media-set-v1/download/index.html'
      - 'tools/publish/lp-media-set-v1/media-map.json'
      - 'tools/check_old_brand_in_p2_pages.py'
      - '.github/workflows/p2-brand-consistency.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  brand-static-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check P2 pages, generators, media map and LINE handoff (offline)
        run: |
          python -m py_compile tools/check_old_brand_in_p2_pages.py
          python tools/check_old_brand_in_p2_pages.py
