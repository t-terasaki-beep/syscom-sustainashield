name: Production-only routes — offline deploy guard

on:
  pull_request:
    paths:
      - 'deploy/publish.sh'
      - 'tests/test_deploy_protected_paths.py'
      - '.github/workflows/deploy-guard-offline.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-no-ftp-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax check and offline blocked-route tests
        run: |
          bash -n deploy/publish.sh
          python -m unittest discover -s tests -p test_deploy_protected_paths.py -v
