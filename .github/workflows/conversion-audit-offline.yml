name: Conversion audit offline regression

on:
  push:
    branches:
      - feature/conversion-audit-v1-20261102
    paths:
      - tools/conversion_audit.py
      - tools/summarize_diagnosis_links.py
      - tools/inspect_diagnosis_live_urls.py
      - tests/test_diagnosis_link_summary.py
      - tests/test_diagnosis_live_urls.py
      - tools/audit_diagnosis_sitemap.py
      - tests/test_diagnosis_sitemap.py
      - tests/test_conversion_audit.py
      - contact.html
      - .github/workflows/conversion-audit-offline.yml
  pull_request:
    paths:
      - tools/conversion_audit.py
      - tools/summarize_diagnosis_links.py
      - tools/inspect_diagnosis_live_urls.py
      - tests/test_diagnosis_link_summary.py
      - tests/test_diagnosis_live_urls.py
      - tools/audit_diagnosis_sitemap.py
      - tests/test_diagnosis_sitemap.py
      - tests/test_conversion_audit.py
      - contact.html
      - .github/workflows/conversion-audit-offline.yml

permissions:
  contents: read

jobs:
  audit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline regression tests (no site access or credentials)
        run: |
          python -m unittest discover -s tests -p 'test_conversion_audit.py' -v
          python -m unittest discover -s tests -p 'test_diagnosis_link_summary.py' -v
          python -m unittest discover -s tests -p 'test_diagnosis_live_urls.py' -v
          python -m unittest discover -s tests -p 'test_diagnosis_sitemap.py' -v
      - name: Inventory diagnosis alias links in GitHub HTML (not live site)
        run: python tools/summarize_diagnosis_links.py . > diagnosis-alias-inventory.json
      - name: Keep read-only link inventory as evidence
        uses: actions/upload-artifact@v4
        with:
          name: diagnosis-alias-inventory
          path: diagnosis-alias-inventory.json
          if-no-files-found: error
          retention-days: 7
      - name: GET-only live alias evidence (no redirects followed; no writes)
        run: python tools/inspect_diagnosis_live_urls.py > diagnosis-live-http-evidence.json
      - name: Retain live HTTP status, Location, canonical and SHA observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnosis-live-http-evidence
          path: diagnosis-live-http-evidence.json
          if-no-files-found: error
          retention-days: 7
      - name: GET-only current sitemap alias inventory (no SEO changes)
        if: always()
        run: python tools/audit_diagnosis_sitemap.py > diagnosis-sitemap-evidence.json
      - name: Retain sitemap HTTP and alias evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnosis-sitemap-evidence
          path: diagnosis-sitemap-evidence.json
          if-no-files-found: error
          retention-days: 7
